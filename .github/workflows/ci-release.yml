name: Build & Release (Windows + Linux)

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  # Disparo manual (aba Actions): compila, testa e guarda os executáveis por 3 dias, para teste
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    strategy:
      # Uma falha num sistema não cancela o outro: a main sempre mostra o resultado dos dois
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout do código
        uses: actions/checkout@v5

      - name: Configurar .NET 10 SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restaurar dependências
        run: dotnet restore OmniSync.slnx

      - name: Compilar solução
        run: dotnet build OmniSync.slnx --configuration Release --no-restore

      - name: Servidor SFTP de teste (OpenSSH local, só Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get install -y -q openssh-server > /dev/null
          SENHA="$(openssl rand -hex 12)"
          sudo useradd -m -s /bin/bash omnisftp
          echo "omnisftp:${SENHA}" | sudo chpasswd
          # Segundo usuário só com SFTP (sem comandos), para a conferência pelo tamanho
          sudo useradd -m -s /bin/bash omnisftponly
          echo "omnisftponly:${SENHA}" | sudo chpasswd
          sudo mkdir -p /run/sshd
          sudo ssh-keygen -A
          printf 'Port 2222\nListenAddress 127.0.0.1\nPasswordAuthentication yes\nKbdInteractiveAuthentication yes\nUsePAM yes\nSubsystem sftp internal-sftp\nPidFile /run/sshd_omnisync.pid\nMatch User omnisftponly\n    ForceCommand internal-sftp\n' | sudo tee /etc/ssh/sshd_omnisync.conf > /dev/null
          sudo /usr/sbin/sshd -f /etc/ssh/sshd_omnisync.conf
          echo "::add-mask::${SENHA}"
          echo "OMNISYNC_SFTP_TEST=sftp://omnisftp@127.0.0.1:2222/home/omnisftp" >> "$GITHUB_ENV"
          echo "OMNISYNC_SFTP_ONLY_TEST=sftp://omnisftponly@127.0.0.1:2222/home/omnisftponly" >> "$GITHUB_ENV"
          echo "OMNISYNC_SFTP_PASSWORD=${SENHA}" >> "$GITHUB_ENV"
          echo "OMNISYNC_SFTP_REQUIRED=1" >> "$GITHUB_ENV"

      - name: Executar testes unitários (xUnit)
        run: dotnet test Tests/OmniSync.Tests.csproj --configuration Release --no-build --verbosity normal

      - name: Publicar executável Windows (win-x64)
        if: matrix.os == 'windows-latest'
        run: dotnet publish OmniSync.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=none -o publish/win-x64

      - name: Autoteste do executável Windows publicado (sozinho, fora da pasta de build)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force smoke | Out-Null
          Copy-Item publish/win-x64/OmniSync.exe smoke/
          $p = Start-Process -FilePath smoke/OmniSync.exe -ArgumentList '--self-test' -PassThru
          if (-not $p.WaitForExit(120000)) { $p.Kill(); throw 'Autoteste excedeu 120 s' }
          $log = Join-Path $env:LOCALAPPDATA 'OmniSync/selftest.log'
          Get-Content $log
          if (-not (Select-String -Path $log -Pattern 'SELF_TEST_OK' -Quiet)) { throw 'Autoteste falhou' }

      - name: Modo de linha de comando do executável Windows publicado
        if: matrix.os == 'windows-latest'
        shell: pwsh
        timeout-minutes: 5
        run: |
          $exe = (Resolve-Path smoke/OmniSync.exe).Path
          $out = & $exe --ajuda | Out-String
          if ($LASTEXITCODE -ne 0 -or $out -notmatch 'sincronizar') { Write-Output $out; throw "--ajuda falhou ($LASTEXITCODE)" }

          $root = Join-Path $env:RUNNER_TEMP 'cli'
          New-Item -ItemType Directory -Force "$root/Origem/Volume", "$root/Backup" | Out-Null
          Set-Content "$root/Origem/Volume/novo.txt" 'novo'
          $settings = @{ Profiles = @(@{ Name = 'Volume'; SourcePath = "$root/Origem/Volume"; DestinationPath = "$root/Backup"; UseSourceFolderNameInDestination = $true }) } | ConvertTo-Json -Depth 4
          New-Item -ItemType Directory -Force (Join-Path $env:LOCALAPPDATA 'OmniSync') | Out-Null
          Set-Content (Join-Path $env:LOCALAPPDATA 'OmniSync/settings.json') $settings -Encoding utf8

          $out = & $exe --sincronizar 'Inexistente' | Out-String
          Write-Output $out
          if ($LASTEXITCODE -ne 3) { throw "Tarefa inexistente deveria sair com 3, saiu com $LASTEXITCODE" }

          $out = & $exe --sincronizar 'volume' | Out-String
          Write-Output $out
          if ($LASTEXITCODE -ne 0) { throw "Sincronização pela linha de comando saiu com $LASTEXITCODE" }
          if (-not (Test-Path "$root/Backup/Volume/novo.txt")) { throw 'Arquivo não foi copiado pela linha de comando' }
          if ($out -notmatch 'Idênticos') { Write-Warning 'Acentos da saída não conferem com a página de código do console' }

      - name: Publicar executável Linux (linux-x64)
        if: matrix.os == 'ubuntu-latest'
        run: dotnet publish OmniSync.csproj -c Release -r linux-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=none -o publish/linux-x64

      - name: Autoteste do executável Linux publicado (sozinho, fora da pasta de build)
        if: matrix.os == 'ubuntu-latest'
        run: |
          mkdir -p smoke && cp publish/linux-x64/OmniSync smoke/
          timeout 120 xvfb-run -a smoke/OmniSync --self-test
          grep SELF_TEST ~/.local/share/OmniSync/selftest.log
          grep -q SELF_TEST_OK ~/.local/share/OmniSync/selftest.log

      - name: Modo de linha de comando do executável Linux publicado
        if: matrix.os == 'ubuntu-latest'
        timeout-minutes: 5
        run: |
          smoke/OmniSync --ajuda | grep -q sincronizar
          smoke/OmniSync --versao | grep -Eq '^OmniSync [0-9]+\.[0-9]+\.[0-9]+'
          set +e
          smoke/OmniSync --sincronizar Inexistente
          code=$?
          set -e
          test "$code" -eq 3

      # Artefatos só em disparo manual (3 dias, para teste) e em tag de versão (1 dia, só para o job
      # de release os pegar). Push na main e pull request só compilam e testam, para não esgotar a
      # cota de armazenamento do Actions. O arquivo permanente fica na release, que não conta na cota.
      - name: Upload de artefato Windows
        if: matrix.os == 'windows-latest' && (github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v'))
        uses: actions/upload-artifact@v6
        with:
          name: OmniSync-win-x64
          path: publish/win-x64/OmniSync.exe
          retention-days: ${{ github.event_name == 'workflow_dispatch' && 3 || 1 }}

      - name: Upload de artefato Linux
        if: matrix.os == 'ubuntu-latest' && (github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v'))
        uses: actions/upload-artifact@v6
        with:
          name: OmniSync-linux-x64
          path: publish/linux-x64/OmniSync
          retention-days: ${{ github.event_name == 'workflow_dispatch' && 3 || 1 }}

  # Release no GitHub, só em tag vX.Y.Z e só depois de Windows e Linux verdes
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout do código
        uses: actions/checkout@v5

      - name: Conferir a tag com a versão do projeto e ler as notas do CHANGELOG
        id: versao
        run: |
          versao="$(grep -oP '(?<=<Version>)[^<]+' OmniSync.csproj)"
          if [ "${GITHUB_REF_NAME}" != "v${versao}" ]; then
            echo "::error::A tag ${GITHUB_REF_NAME} não confere com <Version>${versao}</Version> do OmniSync.csproj"
            exit 1
          fi
          # Seção "## X.Y.Z — data" do CHANGELOG, até a próxima seção "## "
          awk -v v="${versao}" '
            /^## / { dentro = (index($0, "## " v " ") == 1) ; next }
            dentro { print }
          ' CHANGELOG.md > notas.md
          if ! grep -q '[^[:space:]]' notas.md; then
            echo "::error::CHANGELOG.md não tem a seção '## ${versao} — data'"
            exit 1
          fi
          echo "versao=${versao}" >> "$GITHUB_OUTPUT"

      - name: Baixar os executáveis testados
        uses: actions/download-artifact@v7
        with:
          path: artefatos

      - name: Montar os arquivos da release com SHA-256
        env:
          VERSAO: ${{ steps.versao.outputs.versao }}
        run: |
          mkdir release
          cp artefatos/OmniSync-win-x64/OmniSync.exe "release/OmniSync-${VERSAO}-win-x64.exe"
          cp artefatos/OmniSync-linux-x64/OmniSync "release/OmniSync-${VERSAO}-linux-x64"
          chmod +x "release/OmniSync-${VERSAO}-linux-x64"
          (cd release && sha256sum -- * > SHA256SUMS.txt)
          cat release/SHA256SUMS.txt
          printf '\n---\nConferência no Windows (PowerShell): `Get-FileHash .\\OmniSync-%s-win-x64.exe` e compare com `SHA256SUMS.txt`.\n' "${VERSAO}" >> notas.md

      - name: Publicar a release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSAO: ${{ steps.versao.outputs.versao }}
        run: |
          gh release create "${GITHUB_REF_NAME}" release/* \
            --repo "${GITHUB_REPOSITORY}" \
            --title "OmniSync ${VERSAO}" \
            --notes-file notas.md \
            --verify-tag
