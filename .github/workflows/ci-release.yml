name: Build & Release (Windows + Linux)

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restaurar dependências
        run: dotnet restore OmniSync.slnx

      - name: Compilar solução
        run: dotnet build OmniSync.slnx --configuration Release --no-restore

      - name: Executar testes unitários (xUnit)
        run: dotnet test Tests/OmniSync.Tests.csproj --configuration Release --no-build --verbosity normal

      - name: Publicar executável Windows (win-x64)
        if: matrix.os == 'windows-latest'
        run: dotnet publish OmniSync.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=none -o publish/win-x64

      - name: Autoteste do executável Windows publicado (sozinho, fora da pasta de build)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force smoke | Out-Null
          Copy-Item publish/win-x64/OmniSync.exe smoke/
          $p = Start-Process -FilePath smoke/OmniSync.exe -ArgumentList '--self-test' -PassThru
          if (-not $p.WaitForExit(120000)) { $p.Kill(); throw 'Autoteste excedeu 120 s' }
          $log = Join-Path $env:LOCALAPPDATA 'OmniSync/selftest.log'
          Get-Content $log
          if (-not (Select-String -Path $log -Pattern 'SELF_TEST_OK' -Quiet)) { throw 'Autoteste falhou' }

      - name: Modo de linha de comando do executável Windows publicado
        if: matrix.os == 'windows-latest'
        shell: pwsh
        timeout-minutes: 5
        run: |
          $exe = (Resolve-Path smoke/OmniSync.exe).Path
          $out = & $exe --ajuda | Out-String
          if ($LASTEXITCODE -ne 0 -or $out -notmatch 'sincronizar') { Write-Output $out; throw "--ajuda falhou ($LASTEXITCODE)" }

          $root = Join-Path $env:RUNNER_TEMP 'cli'
          New-Item -ItemType Directory -Force "$root/Origem/Volume", "$root/Backup" | Out-Null
          Set-Content "$root/Origem/Volume/novo.txt" 'novo'
          $settings = @{ Profiles = @(@{ Name = 'Volume'; SourcePath = "$root/Origem/Volume"; DestinationPath = "$root/Backup"; UseSourceFolderNameInDestination = $true }) } | ConvertTo-Json -Depth 4
          New-Item -ItemType Directory -Force (Join-Path $env:LOCALAPPDATA 'OmniSync') | Out-Null
          Set-Content (Join-Path $env:LOCALAPPDATA 'OmniSync/settings.json') $settings -Encoding utf8

          $out = & $exe --sincronizar 'Inexistente' | Out-String
          Write-Output $out
          if ($LASTEXITCODE -ne 3) { throw "Tarefa inexistente deveria sair com 3, saiu com $LASTEXITCODE" }

          $out = & $exe --sincronizar 'volume' | Out-String
          Write-Output $out
          if ($LASTEXITCODE -ne 0) { throw "Sincronização pela linha de comando saiu com $LASTEXITCODE" }
          if (-not (Test-Path "$root/Backup/Volume/novo.txt")) { throw 'Arquivo não foi copiado pela linha de comando' }
          if ($out -notmatch 'Idênticos') { Write-Warning 'Acentos da saída não conferem com a página de código do console' }

      - name: Publicar executável Linux (linux-x64)
        if: matrix.os == 'ubuntu-latest'
        run: dotnet publish OmniSync.csproj -c Release -r linux-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=none -o publish/linux-x64

      - name: Autoteste do executável Linux publicado (sozinho, fora da pasta de build)
        if: matrix.os == 'ubuntu-latest'
        run: |
          mkdir -p smoke && cp publish/linux-x64/OmniSync smoke/
          timeout 120 xvfb-run -a smoke/OmniSync --self-test
          grep SELF_TEST ~/.local/share/OmniSync/selftest.log
          grep -q SELF_TEST_OK ~/.local/share/OmniSync/selftest.log

      - name: Modo de linha de comando do executável Linux publicado
        if: matrix.os == 'ubuntu-latest'
        timeout-minutes: 5
        run: |
          smoke/OmniSync --ajuda | grep -q sincronizar
          set +e
          smoke/OmniSync --sincronizar Inexistente
          code=$?
          set -e
          test "$code" -eq 3

      - name: Upload de artefato Windows
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: OmniSync-win-x64
          path: publish/win-x64/OmniSync.exe

      - name: Upload de artefato Linux
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: OmniSync-linux-x64
          path: publish/linux-x64/OmniSync
